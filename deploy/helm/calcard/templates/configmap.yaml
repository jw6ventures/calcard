{{- $name := default .Chart.Name .Values.nameOverride | trunc 63 | trimSuffix "-" -}}
{{- $fullname := (default $name .Values.fullnameOverride) | trunc 63 | trimSuffix "-" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-config
  labels:
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  APP_BASE_URL: {{ required "app.baseUrl is required" .Values.app.baseUrl | quote }}
  APP_DB_MAX_OPEN_CONNS: {{ .Values.app.db.maxOpenConns | quote }}
  APP_DB_MAX_IDLE_CONNS: {{ .Values.app.db.maxIdleConns | quote }}
  APP_DB_CONN_MAX_LIFETIME: {{ .Values.app.db.connMaxLifetime | quote }}
  APP_HTTP_READ_TIMEOUT: {{ .Values.app.http.readTimeout | quote }}
  APP_HTTP_WRITE_TIMEOUT: {{ .Values.app.http.writeTimeout | quote }}
  APP_HTTP_IDLE_TIMEOUT: {{ .Values.app.http.idleTimeout | quote }}
  APP_TRAFFIC_CAPTURE_FILE: {{ .Values.app.trafficCaptureFile | quote }}
  APP_OAUTH_CLIENT_ID: {{ .Values.app.oauth.clientId | quote }}
  APP_OAUTH_ISSUER_URL: {{ .Values.app.oauth.issuerUrl | quote }}
  APP_OAUTH_DISCOVERY_URL: {{ .Values.app.oauth.discoveryUrl | quote }}
  APP_TRUSTED_PROXIES: {{ .Values.app.trustedProxies | quote }}
  LOG_LEVEL: {{ .Values.app.logLevel | quote }}
  {{- with .Values.app.dav }}
  {{- /* hasKey rather than with, so an explicit 0 -- which turns a limit off --
         reaches the server instead of being dropped as an empty value. */}}
  {{- if hasKey . "propfindInfinityEnabled" }}
  APP_DAV_PROPFIND_INFINITY_ENABLED: {{ .propfindInfinityEnabled | quote }}
  {{- end }}
  {{- if hasKey . "maxMultistatusResponses" }}
  APP_DAV_MAX_MULTISTATUS_RESPONSES: {{ .maxMultistatusResponses | quote }}
  {{- end }}
  {{- if hasKey . "maxMultistatusBytes" }}
  APP_DAV_MAX_MULTISTATUS_BYTES: {{ .maxMultistatusBytes | quote }}
  {{- end }}
  {{- if hasKey . "maxFilterElements" }}
  APP_DAV_MAX_FILTER_ELEMENTS: {{ .maxFilterElements | quote }}
  {{- end }}
  {{- if hasKey . "maxReportElementDepth" }}
  APP_DAV_MAX_REPORT_ELEMENT_DEPTH: {{ .maxReportElementDepth | quote }}
  {{- end }}
  {{- if hasKey . "maxCardDAVQueryBytes" }}
  APP_DAV_MAX_CARDDAV_QUERY_BYTES: {{ .maxCardDAVQueryBytes | quote }}
  {{- end }}
  {{- if hasKey . "maxAddressDataProperties" }}
  APP_DAV_MAX_ADDRESS_DATA_PROPERTIES: {{ .maxAddressDataProperties | quote }}
  {{- end }}
  {{- if hasKey . "maxMultigetHrefs" }}
  APP_DAV_MAX_MULTIGET_HREFS: {{ .maxMultigetHrefs | quote }}
  {{- end }}
  {{- if hasKey . "maxReportCandidateRows" }}
  APP_DAV_MAX_REPORT_CANDIDATE_ROWS: {{ .maxReportCandidateRows | quote }}
  {{- end }}
  {{- if hasKey . "syncHistoryRetention" }}
  APP_DAV_SYNC_HISTORY_RETENTION: {{ .syncHistoryRetention | quote }}
  {{- end }}
  {{- end }}
