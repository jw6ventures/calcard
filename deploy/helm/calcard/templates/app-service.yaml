{{- /* RFC 4791 Section 11: the application accepts HTTP Basic only over a
       secure transport, which holds only while every route to it terminates TLS.
       A NodePort or LoadBalancer beside the ingress publishes the cleartext
       container port, so the two settings are refused together rather than
       rendered into a deployment that quietly defeats the rule. */ -}}
{{- if and .Values.ingress.enabled (ne .Values.service.type "ClusterIP") -}}
{{- fail (printf "service.type must be ClusterIP while ingress.enabled is true (got %s): any other type publishes the cleartext container port beside the TLS ingress" .Values.service.type) -}}
{{- end -}}
{{- $name := default .Chart.Name .Values.nameOverride | trunc 63 | trimSuffix "-" -}}
{{- $fullname := (default $name .Values.fullnameOverride) | trunc 63 | trimSuffix "-" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  labels:
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
