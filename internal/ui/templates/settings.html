{{define "content"}}
<style>
    .page-header {
        margin-bottom: 2rem;
    }

    .page-header p {
        color: var(--gray-600);
    }

    .settings-card {
        background: var(--bg-secondary);
        border-radius: var(--border-radius-lg);
        box-shadow: var(--shadow);
        padding: 2rem;
        max-width: 40rem;
    }

    .settings-card h3 {
        margin-bottom: 1.5rem;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
    }

    .form-group label {
        font-weight: 600;
        color: var(--gray-700);
        font-size: 0.9rem;
    }

    .form-help {
        font-size: 0.8rem;
        color: var(--gray-500);
    }
</style>

<div class="page-header">
    <h1>⚙️ Settings</h1>
    <p>Choose how CalCard looks and behaves for you.</p>
</div>

<form method="post" action="/settings" class="settings-card">
    <input type="hidden" name="_csrf" value="{{.CSRFToken}}">
    <h3>Calendar</h3>
    <div class="form-group">
        <label for="week_start">First Day of the Week</label>
        <select id="week_start" name="week_start">
            {{range .WeekdayOptions}}
            <option value="{{.Value}}"{{if .Selected}} selected{{end}}>{{.Name}}</option>
            {{end}}
        </select>
        <span class="form-help">The leftmost column of your month and week views. The other days follow in order.</span>
    </div>
    <button type="submit" class="btn-primary">Save Settings</button>
</form>
{{end}}
{{template "base" .}}
